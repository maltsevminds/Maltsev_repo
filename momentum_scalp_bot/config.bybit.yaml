# ===========================================================================
# Bybit USDT-perpetual (linear). One config for every mode — pick with --mode:
#   backtest : python -m momentum_scalp.main --mode backtest --config config.bybit.yaml
#   paper    : python -m momentum_scalp.main --mode paper    --config config.bybit.yaml
#   testnet  : python -m momentum_scalp.main --mode testnet  --config config.bybit.yaml
# Keys (testnet only): BYBIT_TESTNET_API_KEY / BYBIT_TESTNET_API_SECRET in .env
#       (create them at https://testnet.bybit.com -> API Management)
# backtest & paper need NO keys (public data / virtual balance).
# ===========================================================================

# No hard-coded mode: --mode on the CLI selects it. confirm_live stays locked.
confirm_live: false

exchange:
  id: bybit
  testnet: true               # only consulted in testnet mode
  default_type: swap          # bybit linear perpetuals
  options:
    defaultSubType: linear
  testnet_key_env: BYBIT_TESTNET_API_KEY
  testnet_secret_env: BYBIT_TESTNET_API_SECRET
  # live_* left as defaults; not used in testnet/paper/backtest.

# Bybit's ccxt unified symbols for linear perps carry the :USDT settle suffix.
symbols:
  - BTC/USDT:USDT
  - ETH/USDT:USDT
  - SOL/USDT:USDT
  - BNB/USDT:USDT
  - XRP/USDT:USDT
  - DOGE/USDT:USDT

timeframes:
  bias: 1h
  entry: 5m

leverage_cap: 20

# Strategy / targets / risk / watchdog fall back to the same defaults as
# config.yaml — override here only if you want different values on Bybit.

# Correlation cluster must reference the Bybit symbol strings.
risk:
  clusters:
    majors:
      symbols: [BTC/USDT:USDT, ETH/USDT:USDT, SOL/USDT:USDT]
      max: 2

database:
  # Rows are tagged by mode, so paper/testnet/backtest can share this file;
  # the dashboard's --mode filters to the run you care about.
  path: data/bybit.sqlite

backtest:
  # Used by `--mode backtest` when downloading from Bybit (no --data-dir).
  start: "2024-01-01"
  end: "2024-03-01"
  initial_equity: 10000
  fee_rate: 0.00055          # bybit linear taker ~0.055%
  slippage_pct: 0.0003

watchdog:
  ws_timeout_seconds: 30
  reconnect_max_retries: 10
  reconnect_backoff_seconds: 2

paper:
  initial_equity: 10000
